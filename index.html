<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BergerOS</title>
<link rel="canonical" href="https://www.bergeros.com.br/">
<meta http-equiv="refresh" content="0; url=https://www.bergeros.com.br/">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--paper:#f5f4ef;--ink:#162622;--green:#22452b;--muted:#586660;--line:#d6dcd6}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px}
  .caixa{max-width:30rem;text-align:left}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.04em;
     font-size:clamp(26px,5vw,34px);line-height:1.2;margin:0 0 14px}
  p{color:var(--muted);margin:0 0 22px}
  a.botao{display:inline-block;background:var(--green);color:#fff;text-decoration:none;
          border-radius:3px;padding:14px 20px;font-weight:600;font-size:14px}
  a.botao:hover{background:var(--ink)}
  .nota{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
        font-size:13px;color:var(--muted)}
</style>
</head>
<body>
  <main class="caixa">
    <h1>Este endereço mudou.</h1>
    <p>O Giro de Pátio™ agora fica em <strong>bergeros.com.br</strong>. Estamos te levando
       para lá — se nada acontecer em alguns segundos, é só clicar no botão.</p>
    <p><a class="botao" href="https://www.bergeros.com.br/">Ir para bergeros.com.br</a></p>
    <p class="nota">BergerOS · Raphael Berger · Itajaí, Santa Catarina</p>
  </main>
  <script>location.replace("https://www.bergeros.com.br/");</script>
</body>
</html>
